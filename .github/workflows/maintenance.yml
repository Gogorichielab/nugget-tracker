name: Maintenance

on:
  schedule:
    - cron: '28 8 * * 2'   # Weekly Tuesday 08:28 UTC — kept for stale alignment
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 — Mark stale issues and PRs
  # ────────────────────────────────────────────────────────────
  stale:
    name: Mark Stale Issues & PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed if no further activity
            occurs. Thank you for your contributions.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had recent activity. It will be closed if no further activity
            occurs. Thank you for your contributions.
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
          days-before-stale: 60
          days-before-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 7

  # ────────────────────────────────────────────────────────────
  # JOB 2 — Delete merged codex/, copilot/, and claude/ branches
  # Only deletes branches whose PR was merged >= 2 days ago.
  # ────────────────────────────────────────────────────────────
  cleanup-branches:
    name: Delete Merged Codex, Copilot & Claude Branches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete old merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          TWO_DAYS_SECONDS=$((2 * 24 * 60 * 60))
          NOW_TS=$(date -u +%s)

          echo "Scanning branches in $REPO ..."

          mapfile -t BRANCHES < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" \
              --jq '.[].name' \
              | grep -E '^(claude|codex|copilot)/' || true
          )

          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "No codex/ or copilot/ branches found."
            exit 0
          fi

          for BRANCH in "${BRANCHES[@]}"; do
            echo "Processing branch: $BRANCH"

            MERGED_AT=$(gh api \
              "repos/$REPO/pulls?state=closed&head=$OWNER:$BRANCH&per_page=10" \
              --jq '[.[] | select(.merged_at != null)][0].merged_at // empty' \
              || echo "")

            if [ -z "$MERGED_AT" ]; then
              echo "  → No merged PR found for $BRANCH (skipping)."
              continue
            fi

            MERGED_TS=$(date -d "$MERGED_AT" +%s)
            AGE_SECONDS=$((NOW_TS - MERGED_TS))

            if [ "$AGE_SECONDS" -ge "$TWO_DAYS_SECONDS" ]; then
              echo "  → Branch $BRANCH merged at $MERGED_AT (>= 2 days ago). Deleting..."
              if gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" --silent; then
                echo "  ✓ Successfully deleted $BRANCH"
              else
                echo "  ✗ Failed to delete $BRANCH"
              fi
            else
              echo "  → Branch $BRANCH merged less than 2 days ago (skipping)."
            fi
          done

  # ────────────────────────────────────────────────────────────
  # JOB 3 — Delete any branch (except protected) with no commit
  # activity in the last 7 days, regardless of PR state.
  # ────────────────────────────────────────────────────────────
  cleanup-stale-branches:
    name: Delete Stale Branches (7 days no activity)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete branches with no activity for 7+ days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SEVEN_DAYS_SECONDS=$((7 * 24 * 60 * 60))
          NOW_TS=$(date -u +%s)

          # Get the default branch to always protect it
          DEFAULT_BRANCH=$(gh api "repos/$REPO" --jq '.default_branch')

          # Branches to never delete regardless of age
          PROTECTED="^(${DEFAULT_BRANCH}|main|master|develop|development|staging|production|release)$"

          echo "Scanning all branches in $REPO for stale activity..."

          mapfile -t BRANCHES < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" \
              --jq '.[].name' || true
          )

          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "No branches found."
            exit 0
          fi

          for BRANCH in "${BRANCHES[@]}"; do
            # Skip protected branches
            if echo "$BRANCH" | grep -qE "$PROTECTED"; then
              echo "Skipping protected branch: $BRANCH"
              continue
            fi

            LAST_COMMIT_DATE=$(gh api \
              "repos/$REPO/commits?sha=$BRANCH&per_page=1" \
              --jq '.[0].commit.committer.date // empty' \
              || echo "")

            if [ -z "$LAST_COMMIT_DATE" ]; then
              echo "  → Could not determine last commit for $BRANCH (skipping)."
              continue
            fi

            LAST_COMMIT_TS=$(date -d "$LAST_COMMIT_DATE" +%s)
            AGE_SECONDS=$((NOW_TS - LAST_COMMIT_TS))

            if [ "$AGE_SECONDS" -ge "$SEVEN_DAYS_SECONDS" ]; then
              echo "  → Branch $BRANCH last commit $LAST_COMMIT_DATE (>= 7 days ago). Deleting..."
              if gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" --silent; then
                echo "  ✓ Successfully deleted $BRANCH"
              else
                echo "  ✗ Failed to delete $BRANCH"
              fi
            else
              echo "  → Branch $BRANCH active within 7 days (skipping)."
            fi
          done
