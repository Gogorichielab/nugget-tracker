name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Inject Cloudflare Analytics token
        env:
          CF_BEACON_TOKEN: ${{ secrets.CLOUDFLAREKEY }}
        run: |
          if [ -z "${CF_BEACON_TOKEN}" ]; then
            echo "CLOUDFLAREKEY secret is not set; analytics beacon will be disabled."
          fi
          find src -type f -name '*.html' -print0 \
            | xargs -0 sed -i "s|__CF_BEACON_TOKEN__|${CF_BEACON_TOKEN}|g"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build And Deploy
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_CLIFF_0A4B70B0F }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx --yes @azure/static-web-apps-cli@2.0.9 deploy nugget-tracker \
              --swa-config-location . \
              --api-language node \
              --api-version 20 \
              --env production
          else
            npx --yes @azure/static-web-apps-cli@2.0.9 deploy nugget-tracker \
              --swa-config-location . \
              --api-language node \
              --api-version 20 \
              --dry-run
          fi
