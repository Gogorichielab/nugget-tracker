# Adapted from Gogorichielab/.github workflow-templates/azure-static-web-apps.yml
# Source: organization templates merged in Gogorichielab/.github#2.
# Keep the original deployment token and Cloudflare beacon injection.
name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    name: Build and Deploy Job
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       vars.SWA_ENABLE_PREVIEWS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          lfs: false
      - name: Inject Cloudflare Analytics token
        env:
          CF_BEACON_TOKEN: ${{ secrets.CLOUDFLAREKEY }}
        shell: bash
        run: |
          if [ -z "$CF_BEACON_TOKEN" ]; then
            echo "CLOUDFLAREKEY secret is not set; analytics beacon will be disabled."
          fi
          # Avoid inserting a secret directly into sed replacement syntax.
          python3 - <<'PY'
          import os
          from pathlib import Path
          token = os.environ.get("CF_BEACON_TOKEN", "")
          for path in Path("src").rglob("*.html"):
              contents = path.read_text(encoding="utf-8")
              if "__CF_BEACON_TOKEN__" in contents:
                  path.write_text(contents.replace("__CF_BEACON_TOKEN__", token), encoding="utf-8")
          PY
      - name: Check deployment token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_CLIFF_0A4B70B0F }}
        shell: bash
        run: test -n "$SWA_TOKEN"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_CLIFF_0A4B70B0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src
          api_location: api
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    name: Close Pull Request Job
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.SWA_ENABLE_PREVIEWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Check deployment token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_CLIFF_0A4B70B0F }}
        shell: bash
        run: test -n "$SWA_TOKEN"
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_CLIFF_0A4B70B0F }}
          action: close
